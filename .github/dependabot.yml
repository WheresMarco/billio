version: 2
registries:
  composer-repository-nova-laravel-com:
    type: composer-repository
    url: https://nova.laravel.com
    username: marco@wheresmar.co
    password: "${{secrets.COMPOSER_REPOSITORY_NOVA_LARAVEL_COM_PASSWORD}}"

updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  assignees:
  - wheresmarco
  ignore:
  - dependency-name: algolia/algoliasearch-client-php
    versions:
    - 2.7.3
    - 2.8.0
    - 3.0.0
  - dependency-name: symfony/http-kernel
    versions:
    - 5.2.2
    - 5.2.3
    - 5.2.4
    - 5.2.5
  - dependency-name: sentry/sentry-laravel
    versions:
    - 2.3.1
    - 2.4.1
  - dependency-name: facade/ignition
    versions:
    - 2.5.10
    - 2.5.11
    - 2.5.12
    - 2.5.9
  - dependency-name: laravel/framework
    versions:
    - 7.30.3
  - dependency-name: phpoffice/phpspreadsheet
    versions:
    - 1.16.0
  - dependency-name: simplesoftwareio/simple-qrcode
    versions:
    - 4.1.0
  registries:
  - composer-repository-nova-laravel-com
